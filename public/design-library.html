<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design Library – Themes, Styles, Fonts A–Z, Layouts, Effects</title>
<style>
:root{--bg:#0c0e16;--sf:#161a27;--bd:#262c3f;--tx:#e8eaf3;--mu:#8b93ad;--ac:#7c8cff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);padding:24px;max-width:1240px;margin:auto;line-height:1.5}
h1{font-size:clamp(1.6rem,4vw,2.4rem)}
.sub{color:var(--mu);margin:6px 0 18px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5}
.tab,.btn{background:var(--sf);color:var(--tx);border:1px solid var(--bd);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:.9rem}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff}
.btn:hover,.tab:hover{border-color:var(--ac)}
input{background:var(--sf);border:1px solid var(--bd);color:var(--tx);padding:8px 12px;border-radius:10px;flex:1;min-width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:1rem}.card p,.card small{color:var(--mu);font-size:.82rem}
.sw{display:flex;height:42px;border-radius:8px;overflow:hidden;border:1px solid var(--bd)}
.sw i{flex:1}
.hx{display:flex;flex-wrap:wrap;gap:4px;font:11px ui-monospace,monospace;color:var(--mu)}
.stage{padding:22px;border-radius:12px;display:grid;place-items:center;min-height:120px}
.demo{padding:18px 22px;text-align:center;font-weight:600;min-width:70%}
pre{background:#090b12;border:1px solid var(--bd);border-radius:8px;padding:10px;font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;color:#b9c1e0;max-height:150px;overflow:auto}
.fh{font-size:1.7rem;line-height:1.15}.fb{font-size:.95rem}
.hide{display:none!important}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<h1>Design Library</h1>
<p class="sub" id="count"></p>
<div class="bar">
  <button class="tab on" data-t="palettes">Themes</button>
  <button class="tab" data-t="styles">Styles</button>
  <button class="tab" data-t="fonts">Fonts A–Z</button>
  <button class="tab" data-t="gradients">Gradients</button>
  <button class="tab" data-t="layouts">Layouts</button>
  <button class="tab" data-t="effects">Effects</button>
  <input id="q" placeholder="Search… (e.g. luxury, glass, cafe, neon)">
  <button class="btn" id="exp">Copy full JSON</button>
</div>
<div class="grid" id="grid"></div>
<div id="toast">Copied ✓</div>

<script>
const D=JSON.parse(document.getElementById('design-data').textContent);
const grid=document.getElementById('grid'),store=[];let tab='palettes';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const cp=t=>store.push(t)-1;
function toast(){const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1100)}
function copy(t){try{navigator.clipboard.writeText(t).then(toast)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove();toast()}}
const btn=t=>`<button class="btn" data-c="${cp(t)}">Copy</button>`;
const R={
palettes:()=>D.palettes.map(p=>{const c=p.slice(2,8),n=['bg','surface','primary','secondary','accent','text'];
const css=n.map((k,i)=>`--${k}:${c[i]};`).join('');
return `<div class="card"><h3>${p[0]}</h3><small>${p[1]}</small><div class="sw">${c.map(x=>`<i style="background:${x}"></i>`).join('')}</div><div class="hx">${c.join(' ')}</div><p>Best for: ${p[8]}</p>${btn(':root{'+css+'}')}</div>`}),
styles:()=>D.styles.map(s=>`<div class="card"><h3>${s[0]}</h3><div class="stage" style="background:${s[1]}"><div class="demo" style="${s[2]}">Sample Card</div></div><p>${s[3]}</p><pre>${esc(s[2])}</pre>${btn(s[2])}</div>`),
fonts:()=>D.fonts.map(f=>`<div class="card"><small>${f[0]} · ${f[3]}</small><div class="fh" style="font-family:'${f[1]}',serif">${f[1]}</div><div class="fb" style="font-family:'${f[2]}',sans-serif">The quick brown fox jumps over the lazy dog. Body text in ${f[2]}.</div>${btn(`Heading: ${f[1]} | Body: ${f[2]} | <link href="https://fonts.googleapis.com/css2?family=${f[1].replace(/ /g,'+')}&family=${f[2].replace(/ /g,'+')}&display=swap" rel="stylesheet">`)}</div>`),
gradients:()=>D.gradients.map(g=>`<div class="card"><h3>${g[0]}</h3><div class="stage" style="background:${g[1]}"></div><pre>${esc('background:'+g[1])}</pre>${btn('background:'+g[1]+';')}</div>`),
layouts:()=>D.layouts.map(l=>`<div class="card"><h3>${l[0]}</h3><pre>${esc(l[1])}</pre><p>${esc(l[2])}</p>${btn(l[0]+': '+l[1]+' — '+l[2])}</div>`),
effects:()=>D.effects.map(e=>`<div class="card"><h3>${e[0]}</h3><pre>${esc(e[1])}</pre>${btn(e[1])}</div>`)
};
function render(){store.length=0;grid.innerHTML=R[tab]().join('');filter()}
function filter(){const q=document.getElementById('q').value.toLowerCase();grid.querySelectorAll('.card').forEach(c=>c.classList.toggle('hide',q&&!c.textContent.toLowerCase().includes(q)))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.t;render()});
grid.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b)copy(store[b.dataset.c])});
document.getElementById('q').addEventListener('input',filter);
document.getElementById('exp').onclick=()=>copy(JSON.stringify(D));
const fam=D.fonts.flatMap(f=>[f[1],f[2]]).filter((v,i,a)=>a.indexOf(v)===i).map(f=>'family='+f.replace(/ /g,'+')).join('&');
const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?'+fam+'&display=swap';document.head.appendChild(l);
document.getElementById('count').textContent=`${D.palettes.length} themes · ${D.styles.length} styles · ${D.fonts.length} font pairings · ${D.gradients.length} gradients · ${D.layouts.length} layout blocks · ${D.effects.length} effects`;
render();
</script>
</body>
</html>
