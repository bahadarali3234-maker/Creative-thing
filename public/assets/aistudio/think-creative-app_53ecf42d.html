<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Think Creative · AI Builder</title>
<style>
:root{--bg:#1c1d20;--bg2:#222428;--ink:#eceef2;--mut:#8b90a0;--acc:#0a7cf0;--acc2:#4aa8ff;--hi:#2c2e34;--lo:#101113;--glass:rgba(255,255,255,.06);--gb:rgba(255,255,255,.12);--ease:cubic-bezier(.22,.8,.2,1);--slow:.95s;color-scheme:dark}
:root[data-theme=light]{--bg:#e9ebf0;--bg2:#eef0f5;--ink:#1b1d24;--mut:#6b7080;--hi:#ffffff;--lo:#c5c9d4;--glass:rgba(255,255,255,.55);--gb:rgba(255,255,255,.9);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0b0b0d;font-family:Inter,-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;color:var(--ink)}
button,textarea{font:inherit;color:inherit}
#app{position:relative;width:100%;max-width:430px;height:100%;margin:0 auto;overflow:hidden;background:radial-gradient(120% 70% at 50% -10%,var(--bg2),var(--bg));transition:background .8s}
.raise{background:var(--bg);box-shadow:9px 9px 20px var(--lo),-7px -7px 16px var(--hi);transition:box-shadow .5s var(--ease),transform .5s var(--ease)}
.sink{background:var(--bg);box-shadow:inset 6px 6px 12px var(--lo),inset -5px -5px 11px var(--hi)}
.glass{background:var(--glass);border:1px solid var(--gb);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.btn{border:0;cursor:pointer;border-radius:999px;transition:transform .5s var(--ease),box-shadow .5s var(--ease);position:relative;overflow:hidden}
.btn:active{transform:scale(.94);box-shadow:inset 5px 5px 10px var(--lo),inset -4px -4px 9px var(--hi)}
.btn .rp{position:absolute;border-radius:50%;background:rgba(74,168,255,.35);transform:scale(0);animation:rp .9s var(--ease) forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
.round{width:52px;height:52px;display:grid;place-items:center;font-size:24px;flex:none}
.round svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;display:flex;justify-content:center;align-items:center;gap:8px;z-index:30}
.top i{width:7px;height:7px;border-radius:9px;background:var(--mut);opacity:.5;transition:all .9s var(--ease);cursor:pointer}
.top i.on{width:34px;background:var(--acc);opacity:1;box-shadow:0 0 12px var(--acc)}
.theme{position:absolute;top:calc(env(safe-area-inset-top,0px) + 4px);right:12px;z-index:31;width:40px;height:40px}
/* welcome */
#welcome{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:24px;z-index:20;transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s}
#welcome.gone{opacity:0;transform:scale(.94) translateY(-30px);filter:blur(10px);pointer-events:none}
h1{margin:0 0 34px;text-align:center;font-weight:900;font-size:clamp(54px,17vw,76px);line-height:.9;letter-spacing:-.06em}
h1 span{display:block;background:linear-gradient(100deg,var(--acc),var(--acc2) 60%,var(--acc));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite;filter:drop-shadow(0 8px 24px rgba(10,124,240,.35))}
@keyframes sh{to{background-position:200% 0}}
.comp{border-radius:34px;padding:18px;transition:box-shadow .6s var(--ease),transform .6s var(--ease)}
.comp:focus-within{box-shadow:inset 6px 6px 12px var(--lo),inset -5px -5px 11px var(--hi),0 0 0 1.5px rgba(10,124,240,.5),0 0 40px rgba(10,124,240,.18)}
.comp textarea{width:100%;height:86px;background:none;border:0;outline:0;resize:none;font-size:18px;line-height:1.4}
.comp textarea::placeholder{color:var(--mut)}
.crow{display:flex;align-items:center;gap:10px;position:relative}
.crow .sp{flex:1}
.mode{padding:0 20px;height:50px;font-weight:600;font-size:16px;display:flex;gap:8px;align-items:center}
.menu{position:absolute;bottom:62px;right:62px;border-radius:20px;padding:6px;display:none;min-width:150px;z-index:5}
.menu.open{display:block;animation:pop .6s var(--ease)}
.menu div{padding:12px 14px;border-radius:14px;cursor:pointer;font-weight:500}
.menu div:hover{background:rgba(10,124,240,.15)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.94)}}
.send{background:linear-gradient(145deg,var(--acc2),var(--acc));color:#fff;box-shadow:0 8px 22px rgba(10,124,240,.45)}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.chip{padding:10px 16px;font-size:13px;white-space:nowrap}
/* track */
#track{position:absolute;inset:0;display:flex;width:300%;height:100%;visibility:hidden;will-change:transform;touch-action:pan-y}
#track.show{visibility:visible}
.pane{width:33.3333%;height:100%;position:relative;overflow:hidden}
.scroller{position:absolute;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 62px) 16px 150px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
/* chat */
.nav{position:absolute;top:calc(env(safe-area-inset-top,0px) + 48px);left:14px;right:14px;display:flex;gap:10px;justify-content:space-between;align-items:center;z-index:10}
.nav .round{width:46px;height:46px}
.proj{flex:1;max-width:260px;height:46px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;border-radius:999px;padding:0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bub{margin-left:auto;max-width:86%;padding:16px 20px;border-radius:26px 26px 8px 26px;line-height:1.5;font-size:15.5px;animation:rise .9s var(--ease) both;word-break:break-word}
.stamp{text-align:right;color:var(--mut);font-size:12.5px;margin:8px 6px 22px}
.card{border-radius:26px;padding:12px;margin-bottom:16px;animation:rise .9s var(--ease) both}
.ttl{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-radius:20px;font-weight:600;border:1px solid rgba(10,124,240,.55);box-shadow:0 0 22px rgba(10,124,240,.18)}
.two{display:flex;gap:10px;margin-top:12px}
.two .btn{flex:1;height:48px;font-weight:600;font-size:15px}
.ans{line-height:1.6;font-size:15.5px;animation:rise .9s var(--ease) both;margin:4px 4px 16px}
.think{display:flex;gap:6px;padding:14px 4px}
.think b{width:9px;height:9px;border-radius:9px;background:var(--acc);animation:bl 1.4s infinite ease-in-out}
.think b:nth-child(2){animation-delay:.2s}.think b:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}
.dock{position:absolute;left:0;right:0;bottom:0;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 14px);z-index:10;background:linear-gradient(transparent,var(--bg) 40%)}
.sug{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.sug::-webkit-scrollbar{display:none}
.dock .comp{padding:12px 14px;border-radius:30px}
.dock textarea{height:40px;font-size:16px;padding-top:6px}
/* details */
.stat{display:flex;gap:18px;color:var(--mut);font-size:14px;padding:4px 6px 16px;align-items:center}
.seg{display:flex;padding:5px;border-radius:999px;margin:0 auto 18px;width:max-content;gap:4px}
.seg .btn{padding:11px 22px;font-weight:600;font-size:14.5px;background:none;color:var(--mut)}
.seg .btn.on{color:var(--ink);background:var(--bg);box-shadow:5px 5px 11px var(--lo),-4px -4px 9px var(--hi)}
.tl{position:relative;padding-left:46px}
.tl:before{content:"";position:absolute;left:19px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--acc),transparent);opacity:.5}
.st{position:relative;margin-bottom:14px;opacity:0;transform:translateY(18px);transition:all 1s var(--ease)}
.st.in{opacity:1;transform:none}
.st .ic{position:absolute;left:-46px;top:0;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:17px}
.st .bx{padding:13px 16px;border-radius:18px;font-size:15px;cursor:pointer}
.st .bx small{display:block;color:var(--mut);font-size:12.5px;margin-top:3px}
.st .bx code{background:rgba(10,124,240,.16);color:var(--acc2);padding:3px 9px;border-radius:9px;font-size:13px;margin-left:6px}
.st .more{max-height:0;overflow:hidden;transition:max-height 1s var(--ease);font:12.5px/1.6 ui-monospace,Menlo,monospace;color:var(--mut)}
.st.open .more{max-height:140px;padding-top:10px}
.th{color:var(--mut);font-size:14.5px;padding:8px 2px}
.diff{font:12.5px/1.7 ui-monospace,Menlo,monospace;padding:14px 16px;border-radius:18px;margin-bottom:12px;overflow-x:auto;white-space:pre}
.add{color:#3ddc97}.del{color:#ff6b7a}
/* preview */
.phone{position:absolute;inset:calc(env(safe-area-inset-top,0px) + 100px) 22px 28px;border-radius:40px;overflow:hidden;background:#000;box-shadow:0 0 0 7px var(--bg),0 0 0 8px var(--gb),14px 18px 36px var(--lo),-10px -10px 24px var(--hi)}
.pv{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}
.pv::-webkit-scrollbar{display:none}
.pvh{height:260%;position:relative}
.stick{position:sticky;top:0;height:calc(100vh - 230px);min-height:430px;overflow:hidden;display:grid;place-items:center;text-align:center;color:#fff;background:#000}
.orb{position:absolute;width:170%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff 0,#cfe6ff 22%,#5d8fb8 48%,#0a0a0c 72%);transition:transform .25s linear}
.pt{position:relative;padding:0 18px;transition:opacity 1s var(--ease),transform 1s var(--ease);position:absolute;left:0;right:0}
.pt h2{margin:0;font-size:46px;line-height:1;letter-spacing:-.04em}.pt h2 em{font-style:normal;color:#9fd4ff}
.pt p{letter-spacing:.3em;font-size:11px;opacity:.8}
.pt .go{display:inline-block;margin-top:20px;padding:15px 28px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(14px);font-weight:600}
.pn{position:absolute;top:14px;left:14px;right:14px;height:50px;border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#fff;font-weight:600;font-size:14px;z-index:5;background:rgba(40,40,44,.55);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px)}
.scr{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;opacity:.6;letter-spacing:.3em;font-size:10px;z-index:4}
.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);left:0;right:0;text-align:center;color:var(--mut);font-size:12.5px;z-index:11;pointer-events:none;transition:opacity 1s}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translate(-50%,-30px);opacity:0;padding:12px 22px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;transition:all .8s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
:root{--g2:rgba(255,255,255,.07)}
:root[data-theme=light]{--g2:rgba(255,255,255,.55)}
#app:before,#app:after{content:"";position:absolute;z-index:0;width:360px;height:360px;border-radius:50%;filter:blur(80px);opacity:.5;pointer-events:none;animation:fl 20s ease-in-out infinite alternate}
#app:before{background:#0a7cf0;top:-110px;left:-120px}
#app:after{background:#8a5cff;bottom:-130px;right:-130px;animation-delay:-10s}
:root[data-theme=light] #app:before,:root[data-theme=light] #app:after{opacity:.32}
@keyframes fl{to{transform:translate(70px,80px) scale(1.2)}}
#track{z-index:2}
.pane,.scroller,.dock,.pv,.phone{touch-action:pan-y}
.sug{touch-action:pan-x}
.comp,.chip.raise,.card.raise,.bx.raise,.proj{background:linear-gradient(145deg,var(--g2),transparent 140%);border:1px solid var(--gb);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7)}
.comp,.card.raise{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -10px 24px rgba(0,0,0,.1),0 20px 50px rgba(0,0,0,.25)}
.send{box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 10px 26px rgba(10,124,240,.5)}
@media(hover:hover){.btn:hover:not(:active){transform:translateY(-2px)}}
#welcome{padding:20px 14px}
#welcome .comp{min-height:46vh;padding:24px;border-radius:42px;display:flex;flex-direction:column}
#welcome .comp textarea{flex:1;height:auto;min-height:200px;font-size:21px}
#welcome .round{width:58px;height:58px}
#welcome .mode{height:56px}
h1,#welcome .comp,.chips{animation:rise 1.2s var(--ease) both}
#welcome .comp{animation-delay:.18s}.chips{animation-delay:.36s}
.dock{padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 10px);background:none}
.dock:before{content:"";position:absolute;inset:-22px 0 0;z-index:-1;pointer-events:none;background:linear-gradient(transparent,color-mix(in srgb,var(--bg) 85%,transparent) 60%);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%)}
.dock .comp{padding:8px 10px 8px 18px;border-radius:30px}
.dock textarea{height:34px;padding:5px 0 0;font-size:16px}
.dock .round{width:40px;height:40px}
.dock .mode{height:40px!important;padding:0 16px;font-size:14px}
.dock .crow{gap:8px}
.sug{padding:2px 2px 10px}.sug .chip{padding:8px 14px;font-size:12.5px}
.scroller{padding-bottom:190px}
.hint{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 104px);left:50%;right:auto;transform:translateX(-50%);width:max-content;padding:9px 18px;border-radius:999px;background:var(--g2);border:1px solid var(--gb);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:0}
.sug .chip,.chips .chip{flex:none;scroll-snap-align:start}
.sug{scroll-snap-type:x proximity;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 22px),transparent)}
.att{display:flex;gap:12px;overflow-x:auto;padding:6px 6px 12px 0;scrollbar-width:none;touch-action:pan-x}
.att:empty{display:none}
.at{position:relative;flex:none;width:64px;height:64px;border-radius:18px;background:var(--g2) center/cover;border:1px solid var(--gb);display:grid;place-items:center;font-size:13px;animation:pop .7s var(--ease);box-shadow:5px 5px 11px var(--lo),-4px -4px 9px var(--hi)}
.at.f{width:auto;padding:0 16px}
.at b{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:14px;cursor:pointer}
.sheet{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:70;border-radius:34px;padding:20px;transform:translateY(125%);transition:transform .9s var(--ease)}
.sheet.open{transform:none}
.sheet h4{margin:0 0 14px 4px;font-size:15px;color:var(--mut);font-weight:600}
.scrim{position:absolute;inset:0;z-index:65;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .8s}
.scrim.open{opacity:1;pointer-events:auto}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sg button{aspect-ratio:1;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600}
.sg button span{font-size:26px}
.bub .tn{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.bub .tn i{width:58px;height:58px;border-radius:15px;background:rgba(10,124,240,.2) center/cover;display:grid;place-items:center;font-style:normal;font-size:22px}
.proj{gap:10px}.proj .dl{width:34px;height:34px;margin-left:-8px;display:grid;place-items:center;flex:none;padding:0}
.dl svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.dial{position:absolute;left:30px;right:30px;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);z-index:20;border-radius:30px;padding:16px 18px;transform:translateY(calc(100% + 80px));transition:transform .95s var(--ease)}
.dial,.dial input{touch-action:none}
.dial.open{transform:none}
.dial .sw{display:flex;gap:11px;align-items:center;margin-bottom:8px}
.dial .sw i{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .5s var(--ease)}
.dial .sw i.on{border-color:#fff;transform:scale(1.2)}
.dial label{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--mut);margin-top:8px}
.dial label b{width:52px;font-weight:600}.dial input{flex:1;accent-color:var(--acc)}
.pt h2 em{color:var(--pa,#9fd4ff)}.pt .go{border-radius:var(--pr2,30px);backdrop-filter:blur(var(--pb,14px));-webkit-backdrop-filter:blur(var(--pb,14px))}
.think{align-items:center;gap:14px}.think b{display:none}
.think:before{content:"";width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--acc),#8a5cff,var(--acc2),var(--acc));box-shadow:0 0 28px rgba(10,124,240,.6);-webkit-mask:radial-gradient(circle,transparent 9px,#000 10px);mask:radial-gradient(circle,transparent 9px,#000 10px);animation:spin 1.4s linear infinite}
.think:after{content:attr(data-s);color:var(--mut);font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.live{color:var(--acc2);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(10,124,240,.18),0 0 30px rgba(10,124,240,.5)}}
.ico{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;box-shadow:0 10px 20px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.45)}
.ico svg,.fi svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sheet:before{content:"";display:block;width:42px;height:5px;border-radius:9px;background:var(--mut);opacity:.4;margin:-8px auto 14px}
.lr{display:none;gap:10px;margin-top:14px}.lr.on{display:flex;animation:pop .6s var(--ease)}
.lr input{flex:1;min-width:0;height:48px;border-radius:999px;border:1px solid var(--gb);background:var(--g2);padding:0 18px;font-size:16px;outline:0;color:var(--ink)}
.lr .btn{padding:0 22px;height:48px;font-weight:600}
.at{width:80px;height:80px;border-radius:22px;background:var(--g2) center/cover}
.at.file,.at.link{width:auto;min-width:156px;max-width:220px;padding:0 16px 0 11px;display:flex;align-items:center;gap:10px}
.fi{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 6px 14px rgba(0,0,0,.25)}
.fm{min-width:0;display:flex;flex-direction:column}.fm b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fm small{color:var(--mut);font-size:11.5px}
.at .pg{position:absolute;left:9px;right:9px;bottom:7px;height:4px;border-radius:4px;background:rgba(255,255,255,.28);overflow:hidden;transition:opacity .6s .3s}
.at.file .pg,.at.link .pg{left:62px;bottom:9px}
.at .pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .12s linear}
.at.done .pg{opacity:0}
.at u{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:15px;text-decoration:none;cursor:pointer;box-shadow:0 4px 10px rgba(10,124,240,.5)}
.pl{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff}.pl svg{width:14px;height:14px}
.bub .tn{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.tp{aspect-ratio:1;border-radius:18px;background:var(--g2) center/cover;display:grid;place-items:center;cursor:zoom-in;border:1px solid var(--gb)}
.tn .tp:only-child{grid-column:1/-1;aspect-ratio:16/10}
.tf{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding:9px 12px 9px 9px;border-radius:18px;background:var(--g2);border:1px solid var(--gb)}
