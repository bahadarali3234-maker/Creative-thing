<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creative Studio — AI image designer</title>
<style>
:root{--bg:#f2f4f9;--panel:#ffffff;--ink:#141a2e;--muted:#667089;--line:#dde2ee;--accent:#4f46e5;--accent-ink:#fff;--ok:#0f9d6b;--warn:#c2410c;--bubble:#ffffff;--user:#4f46e5;--shadow:0 6px 24px rgba(20,26,46,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1020;--panel:#151a30;--ink:#eaeefc;--muted:#97a1c4;--line:#262d4d;--accent:#7c83ff;--accent-ink:#0d1020;--ok:#3ddc9c;--warn:#ffa36b;--bubble:#171d36;--user:#5b5bf0;--shadow:0 6px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari","Hind",sans-serif;display:flex;flex-direction:column;font-size:15px;line-height:1.45}
header{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.2px}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.warn{color:var(--warn);border-color:var(--warn)}
button{font:inherit;color:inherit}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:18px}
#chat{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{display:flex}.msg.user{justify-content:flex-end}
.bubble{max-width:min(92%,640px);padding:10px 13px;border-radius:16px;background:var(--bubble);border:1px solid var(--line);box-shadow:var(--shadow);word-wrap:break-word;overflow-wrap:anywhere}
.msg.user .bubble{background:var(--user);color:#fff;border-color:transparent}
.msg.card.wide .bubble{max-width:min(96%,660px);width:auto}
.uthumbs{margin-top:6px;font-size:12px;opacity:.9}
.ctitle{font-weight:700;margin-bottom:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.5}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:7px 12px;cursor:pointer;font-size:13.5px}
.opt.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.q{margin-top:10px}.qt{font-weight:600;font-size:14px}
.qin{width:100%;margin-top:6px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.examples{display:flex;flex-wrap:wrap;gap:8px;padding:0 2px}
.note{margin-top:8px;font-size:12.5px;color:var(--muted)}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
/* generation card */
.gen{display:flex;flex-direction:column;gap:10px}
.think{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg)}
.think summary{cursor:pointer;font-weight:600;color:var(--ink)}
.steps{margin:6px 0 2px;padding-left:18px}.steps li{margin:4px 0}
.stage{position:relative;border-radius:12px;overflow:hidden;background:#000;box-shadow:var(--shadow);align-self:flex-start;max-width:100%}
.stage canvas.result{display:block;cursor:zoom-in}
.shimmer{position:absolute;inset:0;background:linear-gradient(110deg,#1b2140 30%,#2c3566 45%,#1b2140 60%);background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.pbadge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.62);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;backdrop-filter:blur(4px);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{font-size:13px;padding:7px 10px}
.edit .qin{margin-bottom:6px}
.srcs,.gnote{font-size:12.5px;color:var(--muted)}.srcs a{color:var(--accent)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.sgrid a{display:block;position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--bg)}.sgrid img{width:100%;height:100%;object-fit:cover}.sgrid span{position:absolute;left:0;right:0;bottom:0;font-size:10px;color:#fff;background:rgba(0,0,0,.55);padding:2px 5px;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
/* composer */
#pending{display:flex;gap:8px;padding:6px 12px 0}
.pchip{position:relative;width:56px;height:56px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}.pchip canvas{width:100%;height:100%}.pchip button{position:absolute;top:0;right:0;border:none;background:rgba(0,0,0,.6);color:#fff;width:20px;height:20px;border-radius:0 0 0 8px;cursor:pointer;line-height:1}
#composer{display:flex;gap:8px;align-items:flex-end;padding:8px 12px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
#input{flex:1;resize:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 12px;font:inherit;max-height:140px;min-height:42px}
#send{background:var(--accent);color:var(--accent-ink);border:none;width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer}
/* settings */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);width:min(94vw,520px);padding:16px;max-height:92vh}
dialog::backdrop{background:rgba(5,8,20,.55)}
dialog h2{margin:0 0 4px;font-size:18px}
dialog label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 4px}
dialog input,dialog select{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.keyrow{display:flex;gap:6px}.keyrow button{white-space:nowrap}
#steps{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:6px}
#steps li{display:flex;flex-direction:column;border-radius:10px;padding:8px 10px;font-size:13px;border:1px solid var(--line)}
#steps li.pass{border-color:var(--ok)}#steps li.fail{border-color:var(--warn)}#steps span{color:var(--muted);word-break:break-word}
details.adv{margin-top:12px}details.adv summary{cursor:pointer;color:var(--muted);font-size:13px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.vimg{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:6px}
.vx{position:absolute;top:max(12px,env(safe-area-inset-top));right:14px;background:rgba(255,255,255,.15);color:#fff;border:none;font-size:26px;width:40px;height:40px;border-radius:50%}
</style>
</head>
<body>
<header>
  <h1>🎨 Creative Studio</h1>
  <span class="chip warn" id="status">Not set up</span>
  <button class="iconbtn" id="openSettings" aria-label="Settings">⚙️</button>
</header>
<div id="chat" aria-live="polite"></div>
<div id="pending" hidden></div>
<div id="composer">
  <button class="iconbtn" id="attach" aria-label="Attach image">📎</button>
  <input type="file" id="file" accept="image/*" multiple hidden>
  <textarea id="input" rows="1" placeholder="Describe the image you want…  (e.g. YouTube thumbnail banao: AI से कमाई)"></textarea>
  <button id="send" aria-label="Send">➤</button>
</div>

<dialog id="settings">
  <h2>Settings</h2>
  <div class="hint">Your key is stored only in this browser (this file's storage) and is sent only to the API address below.</div>
  <label>Provider</label>
  <select id="prov"><option value="xai">xAI — Grok (api.x.ai)</option><option value="groq">Groq (api.groq.com)</option><option value="custom">Custom / my own proxy</option></select>
  <label>API key</label>
  <div class="keyrow"><input id="key" type="password" placeholder="paste your key" autocomplete="off" spellcheck="false"><button class="btn" id="toggleKey" type="button">Show</button></div>
  <label>Model <span style="opacity:.7">(press “Load models”, then tap the box and pick one)</span></label>
  <input id="model" list="modelList" placeholder="model name" autocomplete="off" spellcheck="false"><datalist id="modelList"></datalist>
  <div class="row"><button class="btn" id="loadModels" type="button">Load models</button><button class="btn primary" id="testSave" type="button">Test &amp; Save</button></div>
  <ol id="steps"></ol>
  <div class="row"><button class="btn" id="saveAnyway" type="button" hidden>Save anyway</button></div>
  <details class="adv"><summary>Advanced (optional)</summary>
    <label>Base URL (leave empty for the provider default; use your own proxy if the browser blocks the API)</label>
    <input id="base" placeholder="https://api.x.ai/v1">
    <label>Image search URL (your Visual A-Z endpoint, e.g. https://yourserver/api/google-scrape-images)</label>
    <input id="searchUrl" placeholder="optional — enables real web photos">
    <label>Image proxy prefix (so web photos can be edited; e.g. https://yourserver/api/studio/img-proxy?url=)</label>
    <input id="proxyUrl" placeholder="optional">
  </details>
  <div class="hint" id="savedNote"></div>
  <div class="row"><button class="btn" id="clearKey" type="button">Remove saved key</button><button class="btn primary" id="closeSettings" type="button">Close</button></div>
</dialog>

function detectLanguage(text) {
  const dev = (text.match(/[\u0900-\u097F]/g) || []).length;
  const lat = (text.match(/[A-Za-z]/g) || []).length;
  if (dev > lat) return 'hi';
  if (dev > 0 && lat > 0) return 'hinglish';
  const hinglishMarks = /\b(kar|karo|do|de|hai|ka|ki|ke|me|mein|se|ko|aur|banao|chahiye|dikhao|nahi)\b/i;
  return hinglishMarks.test(text) && lat > 0 ? 'hinglish' : 'en';
}

/** Parse "1200x628", "1200 × 628", "1200 by 628" → {w,h} clamped, or null */
function parseCustomSize(text, min = 200, max = 4096) {
  const m = /(\d{3,4})\s*(?:x|×|by|\*|X)\s*(\d{3,4})/.exec(text || '');
  if (!m) return null;
  const c = (v) => Math.max(min, Math.min(max, parseInt(v, 10)));
  return { w: c(m[1]), h: c(m[2]) };
}

function inferSizePreset(text) {
  for (const [re, id] of PLATFORM_SIZE) if (re.test(text)) return id;
  return null;
}

function detectIntent(message, attachments = []) {
  const text = String(message || '').trim();
  const lang = detectLanguage(text);

  const reasons = [];
  if (!text) return { intent: 'none', confidence: 0, lang, reasons: ['empty'] };

  let recipe = null;
  for (const [id, re] of GEN_NOUNS) if (re.test(text)) { recipe = id; break; }
  const hasVerb = GEN_VERBS.test(text);
  const explicit = EXPLICIT_GENERATE.test(text);
  const generic = GENERIC_IMG.test(text);
  const search = SEARCH_WORDS.test(text);
  const edit = EDIT_WORDS.test(text);

  // Edit: uploaded image + edit words
  if (edit && (hasImageUpload || generic)) {
    reasons.push('edit-words', hasImageUpload ? 'has-upload' : 'mentions-image');
    return { intent: 'edit', confidence: hasImageUpload ? 0.9 : 0.65, recipe: recipe || 'generic', lang, reasons };
  }

  // Pure search ("find photos of X") is NOT studio, unless a design noun/explicit generate word is present
  if (search && !recipe && !explicit && !hasVerb) return { intent: 'search', confidence: 0.85, lang, reasons: ['search-words'] };
  if (search && generic && !recipe && !explicit) return { intent: 'search', confidence: 0.75, lang, reasons: ['search-words+image'] };

  let score = 0;
  if (recipe) { score += 0.55; reasons.push('design-noun:' + recipe); }
  if (hasVerb) { score += 0.25; reasons.push('make-verb'); }
  if (explicit) { score += 0.45; reasons.push('explicit-generate'); }
  if (generic && hasVerb) { score += 0.2; reasons.push('image-word+verb'); }
  if (hasImageUpload && (recipe || hasVerb)) { score += 0.1; reasons.push('has-upload'); }

  if (score >= 0.6) return { intent: 'generate', confidence: Number(score.toFixed(2)), recipe: recipe || 'generic', lang, reasons };
  if (score >= 0.4) return { intent: 'maybe_generate', confidence: Number(score.toFixed(2)), recipe: recipe || 'generic', lang, reasons };
  return { intent: 'none', confidence: Number(score.toFixed(2)), lang, reasons };
}

function analyzeRequestSignals(message) {

}

const RECIPES_NAME = { thumbnail: 'YouTube thumbnail', poster: 'poster', 'ig-post': 'social post', 'story-reel': 'story / reel cover', banner: 'banner', 'quote-card': 'quote card', logo: 'logo', infographic: 'infographic', wallpaper: 'wallpaper', 'product-ad': 'product ad', 'profile-dp': 'profile picture', invitation: 'invitation', certificate: 'certificate', 'business-card': 'business card', flyer: 'flyer', 'album-cover': 'album cover', 'book-cover': 'book cover', 'news-card': 'news card', menu: 'menu', generic: 'image' };

/* questions + answers → resolved */

  if (uploads.length) q.push({ id: 'photo', text: hi ? 'आपकी फोटो मुख्य सब्जेक्ट में लगानी है?' : 'Use your photo as the main subject?', options: [{ id: 'yes-cutout', label: hi ? 'हाँ, बैकग्राउंड हटाकर' : 'Yes, remove background' }, { id: 'yes-asis', label: hi ? 'हाँ, जैसी है वैसी' : 'Yes, as it is' }, { id: 'no', label: hi ? 'नहीं' : 'No' }], def: 'yes-cutout' });

/* ---------- send ---------- */
const input = $('#input'); input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(140, input.scrollHeight) + 'px'; });

async function send(forced) {

/* ---------- confirm → questions → generate ---------- */

function startGeneration(text, intent, ups, answers, reuse) {

    badge.textContent = `100% · ${fmtT((performance.now() - t0) / 1000)}`; setTimeout(() => badge.remove(), 900); showResult(m, { text, intent, resolved, ups, answers, ...r, box }); $('.think', m).open = false;
