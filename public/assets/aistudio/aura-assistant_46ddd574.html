<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Aura · Voice Assistant</title>
<style>
:root{--candy:#4cc3ff;--candy2:#9be0ff;--navy:#0a2a66;--navy2:#1450c8;--ink:#0b1f4a;--mute:#6179a0;--glass:rgba(255,255,255,.74);--line:rgba(76,195,255,.4);--lvl:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
background:radial-gradient(110% 60% at 50% 0%,#dff3ff 0%,#fff 62%);font-family:Inter,system-ui,"Segoe UI",Roboto,"Noto Nastaliq Urdu","Noto Naskh Arabic",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;font-size:.95rem;color:var(--navy)}
.brand i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--candy) 45%,var(--navy2));box-shadow:0 0 14px var(--candy)}
.tools{display:flex;gap:8px;align-items:center}
select,input,button{font:inherit;color:inherit}
.chip{appearance:none;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:9px 14px;color:var(--navy);font-size:.9rem;backdrop-filter:blur(10px);max-width:46vw}
.icon{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;cursor:pointer;color:var(--navy);backdrop-filter:blur(10px)}
.icon:hover,.chip:hover{border-color:var(--candy)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 16px}
.orb{position:relative;width:min(58vmin,440px);aspect-ratio:1;cursor:pointer;transform:scale(calc(1 + var(--lvl)*.17));transition:transform .09s linear;flex:none}
.orb::before{content:"";position:absolute;inset:-22%;border-radius:50%;pointer-events:none;filter:blur(10px);
background:radial-gradient(circle,rgba(76,195,255,calc(.14 + var(--lvl)*.55)) 0,transparent 66%)}
.orb video{position:relative;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply;display:block;
-webkit-mask-image:radial-gradient(circle,#000 48%,transparent 70%);mask-image:radial-gradient(circle,#000 48%,transparent 70%)}
.ring{position:absolute;inset:14%;border-radius:50%;border:2px solid var(--candy);opacity:0;pointer-events:none}
body[data-s=listening] .ring{animation:rip 2s ease-out infinite}
body[data-s=listening] .ring+.ring{animation-delay:1s}
@keyframes rip{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.5);opacity:0}}
#st{display:flex;align-items:center;gap:8px;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-top:2px}
#st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--candy);box-shadow:0 0 10px var(--candy)}
body[data-s=thinking] #st::before{animation:bl .7s infinite alternate}
@keyframes bl{to{opacity:.2}}
.cap{width:min(680px,94vw);text-align:center;margin-top:8px}
#u{min-height:1.5em;color:var(--mute);font-size:.95rem;line-height:1.6}
#r{max-height:22dvh;overflow:auto;font-size:clamp(1.1rem,2.6vw,1.4rem);line-height:1.75;color:var(--navy);font-weight:500;padding:2px 6px}
.dock{display:flex;gap:10px;align-items:center;width:min(680px,100%);margin:0 auto;padding:10px 16px 18px}
.field{flex:1;display:flex;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px 5px 5px 18px;backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(20,80,200,.1)}
.field:focus-within{border-color:var(--candy);box-shadow:0 10px 34px rgba(76,195,255,.3)}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:1rem;padding:10px 0}
.send{width:40px;height:40px;border-radius:50%;border:0;background:var(--navy);color:#fff;display:grid;place-items:center;cursor:pointer}
.mic{width:62px;height:62px;border-radius:50%;border:0;cursor:pointer;color:#fff;display:grid;place-items:center;flex:none;
background:linear-gradient(145deg,var(--navy2),var(--navy));box-shadow:0 12px 30px rgba(10,42,102,.38),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s,background .3s}
.mic:active{transform:scale(.94)}
.mic svg{width:26px;height:26px}
body[data-s=listening] .mic{background:linear-gradient(145deg,var(--candy),#1e8fe0);box-shadow:0 0 0 8px rgba(76,195,255,.22),0 12px 30px rgba(30,143,224,.5)}
.mic .sq{display:none}
body[data-s=listening] .mic .m,body[data-s=speaking] .mic .m,body[data-s=thinking] .mic .m{display:none}
body[data-s=listening] .mic .sq,body[data-s=speaking] .mic .sq,body[data-s=thinking] .mic .sq{display:block}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:.3s;max-width:90vw;text-align:center;z-index:5}
#toast.on{opacity:1;transform:translate(-50%,0)}
dialog{border:1px solid var(--line);border-radius:24px;padding:24px;width:min(450px,92vw);background:rgba(255,255,255,.94);backdrop-filter:blur(20px);color:var(--ink);box-shadow:0 30px 80px rgba(10,42,102,.28)}
dialog::backdrop{background:rgba(10,42,102,.3);backdrop-filter:blur(5px)}
dialog h2{margin:0 0 4px;font-size:1.2rem;color:var(--navy)}
dialog p{margin:0 0 14px;color:var(--mute);font-size:.88rem;line-height:1.6}
dialog a{color:var(--navy2)}
.f{margin-top:12px}.f label{display:block;font-size:.8rem;color:var(--mute);margin-bottom:5px}
.f select,.f input[type=password],.f input[type=text]{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:.95rem;color:var(--ink)}
.f select:focus,.f input:focus{outline:2px solid var(--candy);outline-offset:1px}
.chk{display:flex;gap:10px;align-items:center;font-size:.92rem;margin-top:14px;cursor:pointer}
.chk input{accent-color:var(--navy2);width:18px;height:18px}
.btns{display:flex;gap:10px;margin-top:20px}
.btns button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--navy);cursor:pointer;font-weight:600}
.pri{background:var(--navy);color:#fff}.sec{background:transparent;color:var(--navy)}
.dd{position:relative}
header{position:relative;z-index:10}
.tools .dd{min-width:150px;max-width:48vw}
.dd-btn{display:flex;align-items:center;gap:8px;width:100%;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:9px 12px 9px 16px;color:var(--navy);font-size:.9rem;cursor:pointer;backdrop-filter:blur(10px);text-align:start;transition:border-color .2s}
.dd-btn:hover,.dd.open .dd-btn{border-color:var(--candy)}
.dd-l{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-btn svg{width:16px;height:16px;flex:none;transition:transform .2s}
.dd.open .dd-btn svg{transform:rotate(180deg)}
.dd-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:250px;max-height:min(52dvh,380px);overflow:auto;padding:6px;border-radius:20px;background:rgba(255,255,255,.97);backdrop-filter:blur(22px);border:1px solid var(--line);box-shadow:0 24px 60px rgba(10,42,102,.22);z-index:20}
.dd.open .dd-menu{display:block;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.dd-i{padding:11px 14px;border-radius:14px;cursor:pointer;color:var(--ink);font-size:.95rem;display:flex;align-items:center;gap:10px}
.dd-i:hover{background:rgba(76,195,255,.16)}
.dd-i.on{background:linear-gradient(135deg,rgba(76,195,255,.28),rgba(20,80,200,.1));color:var(--navy);font-weight:600}
.dd-i.on::after{content:"";margin-inline-start:auto;width:8px;height:8px;border-radius:50%;background:var(--candy);box-shadow:0 0 8px var(--candy)}
.dd.inl .dd-btn{border-radius:12px;background:#fff;padding:11px 12px}
.dd.inl .dd-menu{position:static;margin-top:6px;min-width:0;max-height:190px;box-shadow:none;background:#f3faff}
</style>
</head>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var API='https://api.groq.com/openai/v1', RATE=1.15;
var LANGS=[
{k:'ur-PK',c:'ur',n:'اردو · Urdu (Pakistan)',en:'Urdu (Pakistani), written in Urdu script',strict:1},
{k:'en-US',c:'en',n:'English (US)',en:'English'},
{k:'en-GB',c:'en',n:'English (UK)',en:'English'},
{k:'hi-IN',c:'hi',n:'हिन्दी · Hindi',en:'Hindi, written in Devanagari'},
{k:'ar-SA',c:'ar',n:'العربية · Arabic',en:'Arabic'},
{k:'es-ES',c:'es',n:'Español',en:'Spanish'},
{k:'fr-FR',c:'fr',n:'Français',en:'French'},
{k:'de-DE',c:'de',n:'Deutsch',en:'German'},
{k:'tr-TR',c:'tr',n:'Türkçe',en:'Turkish'},
{k:'pt-BR',c:'pt',n:'Português',en:'Portuguese'},
{k:'ru-RU',c:'ru',n:'Русский',en:'Russian'},
{k:'zh-CN',c:'zh',n:'中文',en:'Chinese'},
{k:'ja-JP',c:'ja',n:'日本語',en:'Japanese'},
{k:'ko-KR',c:'ko',n:'한국어',en:'Korean'}];
var MALE=/\b(asad|guy|davis|ryan|mark|david|daniel|george|james|alex|tom|jorge|diego|jaime|pablo|raul|hamed|naayf|maged|fahed|hamdan|conrad|killian|florian|jonas|christopher|eric|roger|steffan|brian|andrew|ethan|liam|thomas|henri|claude|antoine|jerome|stefan|kerem|ahmet|hemant|prabhat|madhur|rishi|yunyang|keita|injoon|bongjin|gookmin|dmitry|ravi|hanhan|kangkang|male)\b/i;
var FEM=/(uzma|aria|jenny|michelle|ana\b|emma|sonia|libby|maisie|zira|samantha|karen|moira|tessa|serena|female|woman|elvira|dalia|salma|zariyah|amala|katja|seraphina|denise|eloise|vivienne|elena|isabella|paloma|elsa|emel|swara|neerja|kalpana|heera|svetlana|dariya|xiaoxiao|xiaoyi|nanami|aoi|mayu|shiori|sunhi|seoyeon|francisca|thalita|leticia|fernanda|helena|monica|paulina|amelie|marie|hortense|julie|anna|ayumi|yuna|zhiyu|yaoyao|huihui)/i;

var cfg={lang:0,stt:'whisper-large-v3',llm:'llama-3.3-70b-versatile',conv:false,v:{}}, KEY='';
try{var s=JSON.parse(localStorage.getItem('aura.cfg')||'{}');for(var q in s)cfg[q]=s[q];KEY=localStorage.getItem('aura.key')||''}catch(e){}
function save(){try{localStorage.setItem('aura.cfg',JSON.stringify(cfg));localStorage.setItem('aura.key',KEY)}catch(e){}}

var synth=window.speechSynthesis, vid=$('#vid'), root=document.documentElement;
var S='idle', hist=[], voices=[], gen=0, pending=0, streamDone=false, pulse=0, keep=[];
var stream,ac,an,tbuf,rec,chunks,t0,lastV,noise,nn,voiced,cancelRec,ctl;

function L(){return LANGS[cfg.lang]||LANGS[0]}
function setS(x){S=x;document.body.dataset.s=x;
  $('#st').textContent={idle:'Tap to talk',listening:'Listening…',thinking:'Thinking…',speaking:'Speaking…'}[x];
  vid.playbackRate=x==='thinking'?2.2:x==='idle'?1:1.35}
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},3800)}
function clean(t){return t.replace(/[*_`#>~|]/g,'').replace(/[ \t]+/g,' ')}

/* ---------- voices ---------- */
function norm(s){return(s||'').replace('_','-').toLowerCase()}
function score(v){var n=v.name,s=0;if(FEM.test(n))s+=50;if(/natural|neural|online/i.test(n))s+=40;if(/uzma/i.test(n))s+=100;if(/google/i.test(n))s+=15;if(!v.localService)s+=5;return s}
function cands(l){var k=norm(l.k),p=k.split('-')[0],pool;
  if(l.strict)pool=voices.filter(function(v){return norm(v.lang)==='ur-pk'||(/urdu/i.test(v.name)&&/pakistan/i.test(v.name))});
  else{pool=voices.filter(function(v){return norm(v.lang)===k});if(!pool.length)pool=voices.filter(function(v){return norm(v.lang).split('-')[0]===p})}
  return pool.filter(function(v){return !MALE.test(v.name)}).sort(function(a,b){return score(b)-score(a)})}
function pickVoice(){var c=cands(L()),want=cfg.v[L().k];
  return c.filter(function(v){return v.name===want})[0]||c[0]||null}
function renderVoices(){var c=cands(L()),cur=pickVoice();
  ddVox.set(c.map(function(v){return{v:v.name,l:v.name}}),cur&&cur.name,'No female voice found on this device')}
function loadVoices(){voices=synth?synth.getVoices():[];renderVoices()}

/* ---------- animation loop ---------- */
var lvl=0;
function tick(t){var tg;
  if(S==='listening'&&an){an.getByteTimeDomainData(tbuf);var sum=0;for(var i=0;i<tbuf.length;i++){var x=(tbuf[i]-128)/128;sum+=x*x}
    var rms=Math.sqrt(sum/tbuf.length);tg=Math.min(1,rms*7);vad(rms,t)}
  else if(S==='speaking'){tg=.32+.2*Math.sin(t/120)*Math.sin(t/340)+pulse;pulse*=.9}
  else if(S==='thinking')tg=.2+.08*Math.sin(t/260);
  else tg=.05+.03*Math.sin(t/900);
  lvl+=(tg-lvl)*.18;root.style.setProperty('--lvl',lvl.toFixed(3));requestAnimationFrame(tick)}

/* ---------- listening (mic + silence detection) ---------- */
function vad(rms,t){
  if(t-t0<350){noise=(noise*nn+rms)/(nn+1);nn++;return}
  var th=Math.max(.03,noise*2.5);
  if(rms>th){voiced=true;lastV=t}
  else if(voiced&&t-lastV>1300)stopListen();
  else if(!voiced&&t-t0>9000){cancelRec=true;stopListen()}
  if(t-t0>40000)stopListen()}
function startListen(){
  if(!KEY){openDlg();return}
  stopAll();
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(function(st){
    stream=st;ac=new(window.AudioContext||window.webkitAudioContext)();
    var src=ac.createMediaStreamSource(st);an=ac.createAnalyser();an.fftSize=1024;tbuf=new Uint8Array(an.fftSize);src.connect(an);
    var mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].filter(function(t){return window.MediaRecorder&&MediaRecorder.isTypeSupported(t)})[0];
    chunks=[];rec=new MediaRecorder(st,mt?{mimeType:mt}:{});
    rec.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};
    rec.onstop=onRecStop;rec.start();
    t0=performance.now();lastV=t0;noise=0;nn=0;voiced=false;cancelRec=false;setS('listening')
  }).catch(function(){toast('Please allow microphone access')})}
function stopListen(){if(!rec||rec.state==='inactive')return;setS('thinking');rec.stop()}
function releaseMic(){if(stream)stream.getTracks().forEach(function(t){t.stop()});if(ac)ac.close().catch(function(){});stream=ac=an=null}
function onRecStop(){var type=rec.type||'audio/webm',blob=new Blob(chunks,{type:type}),ok=voiced&&!cancelRec&&blob.size>3000;releaseMic();
  if(!ok){setS('idle');if(!cancelRec)toast('Didn’t catch that, try again');return}
  var g=++gen;ctl=new AbortController();
  var fd=new FormData();fd.append('file',blob,'a.'+(type.indexOf('mp4')>-1?'m4a':'webm'));
  fd.append('model',cfg.stt);fd.append('language',L().c);fd.append('temperature','0');fd.append('response_format','json');
  fetch(API+'/audio/transcriptions',{method:'POST',headers:{Authorization:'Bearer '+KEY},body:fd,signal:ctl.signal})
    .then(function(r){return r.ok?r.json():apiErr(r)})
    .then(function(j){if(g!==gen)return;var t=(j.text||'').trim();if(t.length<2){setS('idle');toast('Didn’t catch that, try again');return}ask(t)})
    .catch(function(e){if(e.name!=='AbortError')fail(e)})}
function apiErr(r){return r.json().catch(function(){return{}}).then(function(j){var e=new Error((j.error&&j.error.message)||('Error '+r.status));e.status=r.status;throw e})}
function fail(e){setS('idle');if(e.status===401){toast('Invalid Groq API key');openDlg()}else if(e.status===429)toast('Groq rate limit reached, wait a moment');else toast(e.message||'Something went wrong')}

/* ---------- LLM (streaming) + sentence-by-sentence speech ---------- */
function sys(){return 'You are Aura, a warm, quick and friendly voice assistant. Always reply in '+L().en+'. Your reply is read aloud, so speak naturally in 1 to 3 short sentences unless the user asks for detail. Never use markdown, lists, emojis, asterisks or special symbols.'}
function ask(text){
  var g=++gen;hist.push({role:'user',content:text});$('#u').textContent=text;$('#r').textContent='';
  setS('thinking');pending=0;streamDone=false;ctl=new AbortController();
  fetch(API+'/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+KEY,'Content-Type':'application/json'},signal:ctl.signal,
    body:JSON.stringify({model:cfg.llm,stream:true,temperature:.6,max_tokens:500,messages:[{role:'system',content:sys()}].concat(hist.slice(-14))})})
  .then(function(r){if(!r.ok)return apiErr(r);
    var rd=r.body.getReader(),dec=new TextDecoder(),buf='',full='',sb='';
    function pump(){return rd.read().then(function(o){
      if(g!==gen)return;
      if(o.done){sb=flush(sb,true,g);hist.push({role:'assistant',content:full});streamDone=true;checkEnd(g);return}
      buf+=dec.decode(o.value,{stream:true});var i;
      while((i=buf.indexOf('\n'))>=0){var line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(line.indexOf('data:')!==0||line.indexOf('[DONE]')>-1)continue;
        try{var d=JSON.parse(line.slice(5)).choices[0].delta.content;
          if(d){full+=d;sb+=d;$('#r').textContent=clean(full);sb=flush(sb,false,g)}}catch(e){}}
      return pump()})}
    return pump()})
  .catch(function(e){if(e.name!=='AbortError')fail(e)})}
function flush(s,final,g){var re=/^([\s\S]{12,}?[.!?؟۔।…\n]+)\s/,m;
  while((m=re.exec(s))){speak(m[1],g);s=s.slice(m[0].length)}
  if(final&&s.trim()){speak(s,g);s=''}return s}
function speak(t,g){t=clean(t).trim();if(!t||!synth)return;
  var u=new SpeechSynthesisUtterance(t),v=pickVoice();
  if(v){u.voice=v;u.lang=v.lang}else u.lang=L().k;
  u.rate=RATE;pending++;keep.push(u);
  var end=function(){var i=keep.indexOf(u);if(i>-1)keep.splice(i,1);if(g!==gen)return;pending--;checkEnd(g)};
  u.onend=end;u.onerror=end;u.onboundary=function(){pulse=.3};
  if(S!=='speaking')setS('speaking');synth.speak(u)}
function checkEnd(g){if(g!==gen||!streamDone||pending>0)return;setS('idle');if(cfg.conv)setTimeout(function(){if(S==='idle')startListen()},400)}
function stopAll(){gen++;pending=0;keep=[];if(ctl)ctl.abort();if(synth)synth.cancel();
  if(rec&&rec.state!=='inactive'){cancelRec=true;rec.stop()}else releaseMic();setS('idle')}

/* ---------- custom dropdown (app-style) ---------- */
function closeAll(){document.querySelectorAll('.dd.open').forEach(function(x){x.classList.remove('open')})}
document.addEventListener('click',closeAll);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll()});
function makeDD(host,onPick){
  var btn=document.createElement('button');btn.type='button';btn.className='dd-btn';
  var lab=document.createElement('span');lab.className='dd-l';btn.appendChild(lab);
  btn.insertAdjacentHTML('beforeend','<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>');
  var menu=document.createElement('div');menu.className='dd-menu';menu.setAttribute('role','listbox');
  host.appendChild(btn);host.appendChild(menu);
  btn.onclick=function(e){e.stopPropagation();var o=host.classList.contains('open');closeAll();if(!o)host.classList.add('open')};
  return{set:function(items,val,ph){menu.innerHTML='';var lb='';
    items.forEach(function(it){var d=document.createElement('div'),on=String(it.v)===String(val);
      d.className='dd-i'+(on?' on':'');d.setAttribute('role','option');d.textContent=it.l;
      d.onclick=function(e){e.stopPropagation();closeAll();onPick(it.v)};menu.appendChild(d);if(on)lb=it.l});
    lab.textContent=lb||(items.length?items[0].l:(ph||'—'))}}}

/* ---------- UI wiring ---------- */
function tap(){vid.play().catch(function(){});
  if(S==='idle')startListen();
  else if(S==='listening'){if(voiced)stopListen();else{cancelRec=true;stopListen()}}
  else stopAll()}
$('#orb').onclick=tap;$('#mic').onclick=tap;
function sendTxt(){var t=$('#txt').value.trim();if(!t)return;if(!KEY){openDlg();return}$('#txt').value='';stopAll();ask(t)}
$('#send').onclick=sendTxt;$('#txt').onkeydown=function(e){if(e.key==='Enter')sendTxt()};

var STT=[{v:'whisper-large-v3',l:'Whisper large-v3 · most accurate'},{v:'whisper-large-v3-turbo',l:'Whisper large-v3 turbo · fastest'}];
var LLM=[{v:'llama-3.3-70b-versatile',l:'Llama 3.3 70B · smartest'},{v:'llama-3.1-8b-instant',l:'Llama 3.1 8B · fastest'}];
var ddLang=makeDD($('#lang'),function(v){cfg.lang=+v;save();syncDD();var p=pickVoice();toast('Voice: '+(p?p.name:'not installed on this device'))});
var ddStt=makeDD($('#stt'),function(v){cfg.stt=v;save();syncDD()});
var ddLlm=makeDD($('#llm'),function(v){cfg.llm=v;save();syncDD()});
var ddVox=makeDD($('#vox'),function(v){cfg.v[L().k]=v;save();renderVoices()});
function syncDD(){ddLang.set(LANGS.map(function(l,i){return{v:i,l:l.n}}),cfg.lang);ddStt.set(STT,cfg.stt);ddLlm.set(LLM,cfg.llm);renderVoices()}

var dlg=$('#dlg');
function openDlg(){$('#key').value=KEY;syncDD();$('#conv').checked=!!cfg.conv;renderVoices();if(!dlg.open)dlg.showModal()}
$('#gear').onclick=openDlg;$('#ok').onclick=function(){dlg.close()};
$('#key').onchange=function(){KEY=this.value.trim();save()};
$('#conv').onchange=function(){cfg.conv=this.checked;save()};
$('#clr').onclick=function(){hist=[];$('#u').textContent='';$('#r').textContent='';toast('Chat cleared')};
dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close()});

syncDD();if(synth){loadVoices();synth.onvoiceschanged=loadVoices}
vid.play().catch(function(){});document.addEventListener('pointerdown',function(){vid.play().catch(function(){})},{once:true});
requestAnimationFrame(tick);
if(!KEY)setTimeout(openDlg,500);
})();
</script>
